<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPTU Smart Lab - Story</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<!-- Story copy is composed by the parent Smart Lab scroll scene. -->
<div class="loader" id="loader"><span></span></div>

<!-- Simulated Webpack Chunk Runtime & 3D Night Flower Valley Engine -->
<script>
(function() {
  // Initialize webpackChunk_N_E compatible queue so the boot script runs identically
  self.webpackChunk_N_E = self.webpackChunk_N_E || [];
  const modules = {};
  function __webpack_require__(id) {
    if (modules[id]) return modules[id]();
  }
  const origPush = self.webpackChunk_N_E.push.bind(self.webpackChunk_N_E);
  self.webpackChunk_N_E.push = function(chunk) {
    const [, moreModules, runtime] = chunk;
    if (moreModules) {
      for (const k in moreModules) modules[k] = moreModules[k];
    }
    if (runtime) runtime(__webpack_require__);
    return origPush(chunk);
  };

  // ============================================================================
  // AMBIENT NIGHT VALLEY AUDIO ENGINE (Web Audio API Synthesizer + Low-pass Filter)
  // ============================================================================
  const audioStoreState = {
    isInitialized: false,
    isMuted: true,
    ctx: null,
    masterGain: null,
    lowpass: null,
    chimeTimer: null,

    initAudio() {
      if (this.isInitialized) return;
      this.isInitialized = true;
    },

    _ensureContext() {
      if (this.ctx) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();

      // Master gain (starts muted at 0)
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.0001;

      // Low-pass filter for hover muffle effect
      this.lowpass = this.ctx.createBiquadFilter();
      this.lowpass.type = 'lowpass';
      this.lowpass.frequency.value = 16000;
      this.lowpass.Q.value = 0.7;

      // Stereo delay / lush reverb feedback loop
      const delayL = this.ctx.createDelay(2.0);
      const delayR = this.ctx.createDelay(2.0);
      delayL.delayTime.value = 0.42;
      delayR.delayTime.value = 0.56;
      const fb = this.ctx.createGain();
      fb.gain.value = 0.36;

      this.lowpass.connect(this.masterGain);
      this.lowpass.connect(delayL);
      delayL.connect(delayR);
      delayR.connect(fb);
      fb.connect(delayL);
      fb.connect(this.masterGain);
      this.masterGain.connect(this.ctx.destination);

      // Warm harmonic night-valley pad oscillators (Fmaj9 / Dmin11 atmospheric voicing)
      const freqs = [110.0, 164.81, 196.0, 246.94, 293.66, 329.63, 440.0];
      freqs.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();

        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = f;
        osc.detune.value = (Math.random() - 0.5) * 10;

        // Slow breathing modulation
        lfo.type = 'sine';
        lfo.frequency.value = 0.06 + idx * 0.019;
        lfoGain.gain.value = 0.015 / Math.sqrt(idx + 1);

        oscGain.gain.value = 0.028 / Math.sqrt(idx + 1);
        lfo.connect(oscGain.gain);

        osc.connect(oscGain);
        oscGain.connect(this.lowpass);

        osc.start();
        lfo.start();
      });

      // Gentle filtered night breeze (pink-ish noise)
      const bufferSize = this.ctx.sampleRate * 3;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.015;
        b6 = white * 0.115926;
      }
      const whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const windFilter = this.ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 340;
      windFilter.Q.value = 2.0;

      const windGain = this.ctx.createGain();
      windGain.gain.value = 0.16;

      whiteNoise.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(this.lowpass);
      whiteNoise.start();

      // Delicate crystalline botanical chimes
      const pentatonic = [587.33, 659.25, 783.99, 880.0, 987.77, 1174.66, 1318.51];
      this.chimeTimer = setInterval(() => {
        if (this.isMuted || !this.ctx || this.ctx.state !== 'running') return;
        if (Math.random() > 0.65) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = pentatonic[Math.floor(Math.random() * pentatonic.length)];
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.018, now + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
        osc.connect(g);
        g.connect(this.lowpass);
        osc.start(now);
        osc.stop(now + 2.9);
      }, 1900);
    },

    toggleMute() {
      this._ensureContext();
      if (!this.ctx) return this.isMuted;
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.isMuted = !this.isMuted;
      const now = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
      if (this.isMuted) {
        this.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      } else {
        this.masterGain.gain.exponentialRampToValueAtTime(0.75, now + 1.2);
      }
      return this.isMuted;
    },

    setMuffle(active) {
      if (!this.ctx || !this.lowpass) return;
      const now = this.ctx.currentTime;
      this.lowpass.frequency.cancelScheduledValues(now);
      this.lowpass.frequency.setValueAtTime(Math.max(100, this.lowpass.frequency.value), now);
      this.lowpass.frequency.exponentialRampToValueAtTime(active ? 320 : 16000, now + 0.85);
    }
  };

  function audioStore() {
    return audioStoreState;
  }

  // ============================================================================
  // 3D NIGHT FLOWER VALLEY ENGINE (Three.js r128 + Custom GLSL Shaders + PostFX)
  // ============================================================================
  class Valley {
    constructor(containerEl, onLoaded, onIntroDone) {
      this.root = containerEl;
      this.canvasContainer = containerEl.querySelector('.js-canvas-container') || containerEl;
      this.onLoaded = onLoaded;
      this.onIntroDone = onIntroDone;

      this.width = window.innerWidth;
      this.height = window.innerHeight;
      this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);

      // Flight & Scroll state
      this.pathLength = 420;
      this.scrollPos = 0;
      this.targetScroll = 0;
      this.scrollVelocity = 0;
      this.baseDriftSpeed = 3.8; // units per second when idle

      // Intro & Hover transition state
      this.elapsed = 0;
      this.introDuration = 2.4;
      this.introProgress = 0;
      this.hoverTarget = 0;
      this.hoverProgress = 0;

      // Mouse state in NDC (-1 to 1)
      this.mouse = new THREE.Vector2(0, 0);
      this.targetMouse = new THREE.Vector2(0, 0);
      this.mouseActive = 0;
      this.lastTouchY = 0;

      this._initThree();
      this._buildSplineAndTerrain();
      this._buildValleyMesh();
      this._buildFlowersAndLeaves();
      this._buildLightRaysAndDust();
      this._buildPostProcessing();
      this._bindEvents();

      // Trigger onLoaded shortly after initialization so the pulsing loader fades out smoothly
      setTimeout(() => {
        if (this.onLoaded) this.onLoaded();
      }, 450);

      this.clock = new THREE.Clock();
      this._animate = this._animate.bind(this);
      requestAnimationFrame(this._animate);
    }

    _initThree() {
      this.scene = new THREE.Scene();
      // Keep the shared scene truly black so it reads as animated atmosphere,
      // not as a blue wash over the page sections.
      this.scene.background = new THREE.Color(0x000000);

      this.camera = new THREE.PerspectiveCamera(52, this.width / this.height, 0.5, 220);
      this.renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        stencil: false,
        depth: true
      });
      this.renderer.setSize(this.width, this.height);
      this.renderer.setPixelRatio(this.dpr);
      this.canvasContainer.appendChild(this.renderer.domElement);
    }

    // Mathematical valley heightfield centered around the sinuous camera path
    _getValleyCenterX(z) {
      return Math.sin(z * 0.024) * 18.0 + Math.cos(z * 0.011) * 9.0;
    }

    _getTerrainHeight(x, z) {
      const cx = this._getValleyCenterX(z);
      const dx = x - cx;
      const dist = Math.abs(dx);
      // U-shaped valley walls rising on both sides of the winding stream/path
      const valleyRise = Math.pow(Math.max(0, dist - 2.0), 1.58) * 0.19;
      // Organic rolling hills and terraces
      const hills =
        Math.sin(x * 0.09 + z * 0.07) * 2.1 +
        Math.cos(x * 0.22 - z * 0.16) * 0.85 +
        Math.sin(z * 0.035) * 2.6 +
        Math.sin(x * 0.45 + z * 0.42) * 0.25;
      return Math.min(34.0, valleyRise + hills);
    }

    _buildSplineAndTerrain() {
      // Create a seamless looping curve sampling the valley floor
      const pts = [];
      const segments = 120;
      for (let i = 0; i <= segments; i++) {
        const z = -(i / segments) * this.pathLength;
        const cx = this._getValleyCenterX(z);
        const y = this._getTerrainHeight(cx, z) + 3.4;
        pts.push(new THREE.Vector3(cx, y, z));
      }
      this.cameraCurve = new THREE.CatmullRomCurve3(pts);
    }

    _buildValleyMesh() {
      // Dark velvety ground surface so flowers never float in a void and horizon silhouettes read clearly
      const widthSegs = 90;
      const lenSegs = 260;
      const geo = new THREE.PlaneGeometry(130, this.pathLength, widthSegs, lenSegs);
      geo.rotateX(-Math.PI / 2);

      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        // Shift Z from [-pathLength/2..pathLength/2] to [-pathLength..0]
        const vz = pos.getZ(i) - this.pathLength * 0.5;
        const cx = this._getValleyCenterX(vz);
        const worldX = vx + cx;
        const wy = this._getTerrainHeight(worldX, vz) - 0.35;

        pos.setXYZ(i, worldX, wy, vz);

        // Neutral near-black terrain keeps the particles visible without a blue cast.
        const n = 0.5 + 0.5 * Math.sin(worldX * 0.15 + vz * 0.12);
        const shade = 0.01 + n * 0.012;
        colors[i * 3 + 0] = shade;
        colors[i * 3 + 1] = shade;
        colors[i * 3 + 2] = shade;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      this.terrainUniforms = {
        uScrollZ: { value: 0 },
        uPathLength: { value: this.pathLength },
        uFogColor: { value: new THREE.Color(0x000000) }
      };

      const mat = new THREE.ShaderMaterial({
        uniforms: this.terrainUniforms,
        vertexShader: `
          attribute vec3 color;
          varying vec3 vColor;
          varying float vDist;
          uniform float uScrollZ;
          uniform float uPathLength;

          void main() {
            vColor = color;
            vec3 p = position;
            // Wrap Z relative to camera uScrollZ into [-uPathLength*0.85, uPathLength*0.15]
            float relZ = mod(p.z - uScrollZ, uPathLength);
            if (relZ > uPathLength * 0.12) relZ -= uPathLength;
            p.z = uScrollZ + relZ;

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            vDist = -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vDist;
          uniform vec3 uFogColor;

          void main() {
            float fogFactor = smoothstep(18.0, 145.0, vDist);
            vec3 col = mix(vColor, uFogColor, fogFactor);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      this.terrainMesh = new THREE.Mesh(geo, mat);
      this.terrainMesh.frustumCulled = false;
      this.scene.add(this.terrainMesh);
    }

    _buildFlowersAndLeaves() {
      // Scatter 70,000 point-sprite flowers & leaves across the valley
      const count = 70000;
      const geo = new THREE.BufferGeometry();

      const positions = new Float32Array(count * 3);
      const aColor = new Float32Array(count * 3);
      const aScale = new Float32Array(count);
      const aType = new Float32Array(count); // < 0.48 = leaf/foliage, >= 0.48 = flower blossom
      const aSeed = new Float32Array(count);
      const aScatterDir = new Float32Array(count * 3);

      // Rich night-valley palette inspired by Gladeye's bioluminescent valley:
      // Warm cream blossoms, golden amber cores, soft rose/magenta, twilight violet, bioluminescent cyan, and lush emerald/forest leaves
      const flowerPalette = [
        new THREE.Color('#fff7e8'), // Warm luminous cream
        new THREE.Color('#ffd166'), // Golden nectar
        new THREE.Color('#ff758f'), // Night rose / coral blossom
        new THREE.Color('#c77dff'), // Twilight orchid / lavender
        new THREE.Color('#64dfdf'), // Bioluminescent aqua/cyan
        new THREE.Color('#ff9e64'), // Marigold glow
        new THREE.Color('#f4a261'), // Warm apricot
        new THREE.Color('#e0aaff')  // Pale lilac star
      ];

      const leafPalette = [
        new THREE.Color('#1b4332'), // Deep fern green
        new THREE.Color('#2d6a4f'), // Moss emerald
        new THREE.Color('#40916c'), // Sage foliage
        new THREE.Color('#163a47'), // Midnight teal leaf
        new THREE.Color('#386641')  // Woodland olive
      ];

      for (let i = 0; i < count; i++) {
        const z = -Math.random() * this.pathLength;
        const cx = this._getValleyCenterX(z);

        // Concentrate near valley floor & slopes, keeping a narrow breathing channel right under camera
        const side = Math.random() < 0.5 ? -1 : 1;
        const spread = Math.pow(Math.random(), 1.25) * 52.0;
        const laneOffset = side * (0.6 + spread) + (Math.random() - 0.5) * 2.5;
        const x = cx + laneOffset;

        const groundY = this._getTerrainHeight(x, z);
        const isFlower = Math.random() > 0.45 ? 1.0 : 0.0;

        // Flowers sit slightly above the leaf bed on slender stems
        const y = groundY + (isFlower > 0.5 ? 0.18 + Math.random() * 0.45 : Math.random() * 0.22);

        positions[i * 3 + 0] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // Cluster flower colors naturally using spatial noise
        let col;
        if (isFlower > 0.5) {
          const clusterNoise = Math.sin(x * 0.14 + z * 0.09) * 0.5 + 0.5;
          const idx = Math.floor((clusterNoise * 0.7 + Math.random() * 0.3) * flowerPalette.length) % flowerPalette.length;
          col = flowerPalette[idx].clone();
          col.offsetHSL((Math.random() - 0.5) * 0.04, 0, (Math.random() - 0.5) * 0.08);
        } else {
          const idx = Math.floor(Math.random() * leafPalette.length);
          col = leafPalette[idx].clone();
          col.offsetHSL((Math.random() - 0.5) * 0.04, 0, (Math.random() - 0.5) * 0.06);
        }

        aColor[i * 3 + 0] = col.r;
        aColor[i * 3 + 1] = col.g;
        aColor[i * 3 + 2] = col.b;

        aType[i] = isFlower > 0.5 ? 0.5 + Math.random() * 0.5 : Math.random() * 0.45;
        aScale[i] = isFlower > 0.5 ? (0.75 + Math.pow(Math.random(), 2.0) * 1.95) : (0.85 + Math.random() * 1.35);
        aSeed[i] = Math.random() * 100.0;

        // Outward 3D dispersion vector for startHoverTransition()
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const radius = 5.0 + Math.random() * 18.0;
        aScatterDir[i * 3 + 0] = Math.sin(phi) * Math.cos(theta) * radius;
        aScatterDir[i * 3 + 1] = Math.abs(Math.cos(phi)) * radius * 0.95 + 2.5;
        aScatterDir[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * radius;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(aColor, 3));
      geo.setAttribute('aScale', new THREE.BufferAttribute(aScale, 1));
      geo.setAttribute('aType', new THREE.BufferAttribute(aType, 1));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
      geo.setAttribute('aScatterDir', new THREE.BufferAttribute(aScatterDir, 3));

      this.flowerUniforms = {
        uTime: { value: 0 },
        uScrollZ: { value: 0 },
        uPathLength: { value: this.pathLength },
        uPixelRatio: { value: this.dpr },
        uViewportHeight: { value: this.height },
        uAspect: { value: this.width / this.height },
        uMouse: { value: new THREE.Vector2(0, 0) },
        uMouseActive: { value: 0 },
        uHover: { value: 0 },
        uIntro: { value: 0 },
        uFogColor: { value: new THREE.Color(0x000000) }
      };

      const mat = new THREE.ShaderMaterial({
        uniforms: this.flowerUniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
        vertexShader: `
          attribute vec3 aColor;
          attribute float aScale;
          attribute float aType;
          attribute float aSeed;
          attribute vec3 aScatterDir;

          varying vec3 vColor;
          varying float vType;
          varying float vSeed;
          varying float vGlow;
          varying float vAlpha;
          varying float vHover;
          varying float vBloomStage;

          uniform float uTime;
          uniform float uScrollZ;
          uniform float uPathLength;
          uniform float uPixelRatio;
          uniform float uViewportHeight;
          uniform float uAspect;
          uniform vec2 uMouse;
          uniform float uMouseActive;
          uniform float uHover;
          uniform float uIntro;

          void main() {
            vColor = aColor;
            vType = aType;
